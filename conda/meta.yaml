package:
  name: premise_gwp
  version: {{ environ['VERSION'] }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=64
    - wheel
  run:
    - python
    - bw2io
    - bw2data
    - requests
    - pyyaml
    - numpy<2.0.0

test:
  imports:
    - premise_gwp
  commands:
    - python -c "from premise_gwp.biosphere import load_ei310_mapping, load_ei311_mapping; assert load_ei310_mapping(); assert load_ei311_mapping()"

about:
  home: https://github.com/romainsacchi/premise_gwp
  license: BSD License
  summary: "Adds IPCC's LCIA methods to Brightway2 project that include biogenic CO2 characterization factors,
  to properly account for BECCS performance."
license_family: BSD
